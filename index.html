<!doctype html>
<html lang="en-AU">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pantheon</title>
    <meta
      name="description"
      content="Seven carved totems, seven gods. Hold one and its domain becomes a musical force — storm, ocean, depth, growth, sunlight, the hunt, war. Move while you hold to shape it, drag to layer them, and hear what the gods do to each other."
    />

    <!--
      The link-preview card: public/card.png, 1200x630 --- replace it. The URL
      resolves against this page, like any link. No og:title/og:description:
      scrapers fall back to the <title> and description above.
    -->
    <meta property="og:type" content="website" />
    <meta property="og:image" content="./card.png" />
    <meta name="twitter:card" content="summary_large_image" />

    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <!--
      The sky, sea and underworld of the scene. Every layer's strength is a
      custom property written from main.ts (--g-zeus and friends), and each
      one falls at the rate its god's sound decays, so the picture holds for
      exactly as long as you can hear it.
    -->
    <div class="aether" aria-hidden="true">
      <div class="layer sky"></div>
      <div class="layer sea"></div>
      <div class="layer deep"></div>
      <div class="layer bloom"></div>
      <div class="layer sun"></div>
      <div class="layer stars"></div>
      <div class="layer shock"></div>
    </div>

    <header>
      <nav aria-label="Primary">
        <a href="./">Home</a>
      </nav>
      <!--
        The only control that isn't a god. It is a safety valve, not a tone
        parameter --- and unlike the totems it really is a two-state toggle,
        so aria-pressed belongs here and nowhere else on the page.
      -->
      <button type="button" class="mute" data-mute aria-pressed="false">
        <span class="mute-mark" aria-hidden="true"></span>
        <span class="mute-text">Mute</span>
      </button>
    </header>

    <main>
      <h1>Pantheon</h1>
      <div class="meander" aria-hidden="true"></div>

      <!--
        Opening invitation, then the page's only live region. Once the first
        god sounds this stops inviting and starts describing what is actually
        awake --- which is also how a screen-reader user hears the state that
        the glow carries visually.
      -->
      <p data-start aria-live="polite">The pantheon sleeps. Touch a god to invoke them.</p>
      <p class="hint">Touch, hold and move &middot; Keys A&ndash;J</p>

      <!--
        Seven gods, seven domains, one pitch system underneath them all.
        The totems are momentary --- held, not toggled --- so they carry no
        aria-pressed; held state reaches assistive tech through the live
        region above and .is-awake carries it visually.
      -->
      <div class="totems" role="group" aria-label="Totems of the pantheon">
        <button
          type="button"
          class="totem"
          data-god="zeus"
          data-key="a"
          aria-label="Zeus — sky and thunder. Key A."
        >
          <span class="totem-glyph">
            <svg
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="1.6"
              stroke-linecap="round"
              stroke-linejoin="round"
              aria-hidden="true"
              focusable="false"
            >
              <path d="M14 2 6 13h5l-2 9 9-12h-5z" />
            </svg>
          </span>
          <span class="totem-name">Zeus</span>
          <span class="totem-key">A</span>
        </button>

        <button
          type="button"
          class="totem"
          data-god="poseidon"
          data-key="s"
          aria-label="Poseidon — sea and swell. Key S."
        >
          <span class="totem-glyph">
            <svg
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="1.6"
              stroke-linecap="round"
              stroke-linejoin="round"
              aria-hidden="true"
              focusable="false"
            >
              <path d="M12 3v19M5 11V6M19 11V6M4.5 11h15" />
              <path d="M12 3l-1.6 2.2M12 3l1.6 2.2M5 6L3.8 7.6M5 6l1.2 1.6M19 6l-1.2 1.6M19 6l1.2 1.6" />
            </svg>
          </span>
          <span class="totem-name">Poseidon</span>
          <span class="totem-key">S</span>
        </button>

        <button
          type="button"
          class="totem"
          data-god="hades"
          data-key="d"
          aria-label="Hades — the underworld. Key D."
        >
          <span class="totem-glyph">
            <svg
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="1.6"
              stroke-linecap="round"
              stroke-linejoin="round"
              aria-hidden="true"
              focusable="false"
            >
              <path d="M12 22V9M6.5 9.5V4.5M17.5 9.5V4.5M5 10h14" />
              <path d="M6.5 4.5L5.3 6.1M6.5 4.5l1.2 1.6M17.5 4.5l-1.2 1.6M17.5 4.5l1.2 1.6" />
            </svg>
          </span>
          <span class="totem-name">Hades</span>
          <span class="totem-key">D</span>
        </button>

        <button
          type="button"
          class="totem"
          data-god="demeter"
          data-key="f"
          aria-label="Demeter — growth and harvest. Key F."
        >
          <span class="totem-glyph">
            <svg
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="1.6"
              stroke-linecap="round"
              stroke-linejoin="round"
              aria-hidden="true"
              focusable="false"
            >
              <path d="M12 22V4M12 4l-2 2.2M12 4l2 2.2" />
              <path d="M12 9L8 6.5M12 9l4-2.5M12 13.5L8 11M12 13.5l4-2.5M12 18L8 15.5M12 18l4-2.5" />
            </svg>
          </span>
          <span class="totem-name">Demeter</span>
          <span class="totem-key">F</span>
        </button>

        <button
          type="button"
          class="totem"
          data-god="apollo"
          data-key="g"
          aria-label="Apollo — sunlight and the lyre. Key G."
        >
          <span class="totem-glyph">
            <svg
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="1.6"
              stroke-linecap="round"
              stroke-linejoin="round"
              aria-hidden="true"
              focusable="false"
            >
              <!-- tortoise-shell soundbox at the foot, two arms flaring past
                   the yoke; the tips breaking the crossbar are what stop the
                   silhouette closing into a barrel -->
              <path d="M8 17.5c0 2.7 1.8 4.5 4 4.5s4-1.8 4-4.5" />
              <path d="M8 17.5h8" />
              <path d="M8 17.5C5.5 13 4 8 5 3.5M16 17.5c2.5-4.5 4-9.5 3-14" />
              <path d="M4.5 6.5h15" />
              <path d="M9.5 7v10.5M12 7v10.5M14.5 7v10.5" stroke-width="0.9" />
            </svg>
          </span>
          <span class="totem-name">Apollo</span>
          <span class="totem-key">G</span>
        </button>

        <button
          type="button"
          class="totem"
          data-god="artemis"
          data-key="h"
          aria-label="Artemis — the hunt and the moon. Key H."
        >
          <span class="totem-glyph">
            <svg
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="1.6"
              stroke-linecap="round"
              stroke-linejoin="round"
              aria-hidden="true"
              focusable="false"
            >
              <path d="M7 2.5C13 6.5 13 17.5 7 21.5M7 2.5v19" />
              <path d="M5.5 12h13M18.5 12l-3-2.2M18.5 12l-3 2.2" />
            </svg>
          </span>
          <span class="totem-name">Artemis</span>
          <span class="totem-key">H</span>
        </button>

        <button
          type="button"
          class="totem"
          data-god="ares"
          data-key="j"
          aria-label="Ares — war and the drum. Key J."
        >
          <span class="totem-glyph">
            <svg
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="1.6"
              stroke-linecap="round"
              stroke-linejoin="round"
              aria-hidden="true"
              focusable="false"
            >
              <!-- the spears break either side of the boss so the shield reads
                   as in front of them, not as a crosshair over them -->
              <path d="M4 20 7.8 16.2M16.2 7.8 20 4M20 4l-4 .6M20 4l-.6 4" />
              <path d="M20 20 16.2 16.2M7.8 7.8 4 4M4 4l4 .6M4 4l.6 4" />
              <circle cx="12" cy="12" r="4" />
              <circle cx="12" cy="12" r="1" />
            </svg>
          </span>
          <span class="totem-name">Ares</span>
          <span class="totem-key">J</span>
        </button>
      </div>
    </main>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
